<text x="196.8" y="1225" text-anchor="start" font-size="12" fill="#5b6a72" font-weight="400">blocked, refused, or withheld</text>
<line x1="421.7" y1="1221" x2="455.7" y2="1221" stroke="#0e4f52" stroke-width="2.4"/>
<text x="465.7" y="1225" text-anchor="start" font-size="12" fill="#14211f" font-weight="700">Autonomous loop</text>
<text x="579.2" y="1225" text-anchor="start" font-size="12" fill="#5b6a72" font-weight="400">runs unwatched, nobody asked</text>
<line x1="798.0" y1="1221" x2="832.0" y2="1221" stroke="#5b6a72" stroke-width="2.4" stroke-dasharray="6 5"/>
<text x="842.0" y="1225" text-anchor="start" font-size="12" fill="#14211f" font-weight="700">Human decision required</text>
<text x="1010.7" y="1225" text-anchor="start" font-size="12" fill="#5b6a72" font-weight="400">the two things it will not do alone</text></svg>