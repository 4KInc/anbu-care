function vRecord(){
  // The credential check comes FIRST. The parent id is read from the brief,
  // which itself needs a credential, so ordering these the other way meant an
  // uncredentialed visitor fell through to "open a case" and was never shown
  // the sign-in at all — the gate was unreachable from the one view that
  // exists behind it.
  if(!S.token && !S.linkToken) return S.caseId ? gate() : vOpenOrWait();
  if(!S.parentId) return vOpenOrWait();
  if(S.record?.__denied) return denied(S.record.detail,"The health record");
  if(!S.record) return `<div class="card"><p class="mute">Reading the record…</p></div>`;
  const docs=S.record.documents||[], pr=S.record.profile||{};
  return `${synthOnce()}
  ${title("Health record","Parsed from uploaded documents. New readings are compared with the baseline.")}
  ${vHandoff()}
  <div class="card"><h2 class="mini">Baseline</h2>
    ${row("Name",esc(pr.name))}${row("Age",esc(pr.age))}
    ${row("Conditions",(pr.chronic_conditions||[]).map(esc).join(", ")||unknown("none recorded"))}
    ${row("Allergies",(pr.allergies||[]).map(esc).join(", ")||unknown("none recorded"))}
    ${(pr.medications||[]).length
        ? `<div class="row stack"><div class="k">Medication</div><div class="v">
             ${(pr.medications||[]).map(m=>`<span class="chip">${esc(titleCase(
                 String(m.name||"").replace(/^(tab|tablet|cap|capsule)\b\.?\s*/i,"")))}${
                 m.dose?` ${esc(m.dose)}`:""}</span>`).join(" ")}
           </div></div>`
        : row("Medication", unknown("none recorded"))}
  </div>
  ${vClinicianNotes()}
  ${vDiagnostics()}
  <div class="sec">Documents on file</div>
  ${docs.length===0?`<div class="card"><p>${unknown("no documents have been added yet")}</p></div>`:""}
  ${docs.map(d=>{
    // If anything in this document is new and abnormal, the line reads as a
    // warning even when other values were stable — a mixed result must not be
    // coloured reassuringly because one analyte happened not to move.
    const txt=d.delta_vs_baseline||"";
    const base=/consistent with baseline/.test(txt) && !/new and abnormal/.test(txt);
    return `<div class="card ${base?"edge-teal":"edge-amber"}">
      <h2>${esc(DOC_LABEL[d.kind]||String(d.kind||"document").replace(/_/g," "))}</h2>
      <p class="mute" style="margin:-8px 0 10px;font-size:13px">${esc(d.document_id||"")}</p>
      ${d.summary?`<p style="margin:0 0 12px">${esc(d.summary)}</p>`:""}
      ${arrivedMidEpisode(d)?`<div class="pills" style="margin:-6px 0 12px">
        <span class="pill p-slate">added during this episode · ${esc(new Date(d.parsed_at).toLocaleTimeString())}</span>
      </div>`:""}
      ${docDetails(d)}
      ${(d.observations||[]).length===0
        // A prescription has no lab values, and saying so as an "unknown"
        // reports a normal document as missing data. Only a lab report with
        // nothing read off it is genuinely an unknown.
        ? (d.kind==="blood_report"
            ? `<p>${unknown("no results could be read off this report")}</p>` : "")
        :d.observations.map(o=>`<div class="obs">
            <div class="n">${esc(o.name)}</div>
            <div class="v num">${esc(o.value)} <span class="u">${esc(o.unit||"")}</span>
              ${o.flag?`<span class="pill ${["high","low","abnormal"].includes((o.flag||"").toLowerCase())?"p-red":"p-teal"}">${esc(o.flag)}</span>`:""}
            </div></div>`).join("")}
      <button class="paper" onclick="openDocPhoto('${esc(d.document_id)}')">
        <span aria-hidden="true">◱</span> Open the photograph it was read from</button>
      ${d.delta_vs_baseline?`<div class="deltas">
        ${d.delta_vs_baseline.split("; ").map(n=>{
          const material=/new and abnormal/.test(n);
          const stable=/consistent with baseline|within normal variation/.test(n);
          return `<div class="dline ${material?"new":stable?"base":""}">
            <span class="ic">${material?"⚠":"✓"}</span><span>${esc(n)}</span></div>`;
        }).join("")}
      </div>`:""}
    </div>`;}).join("")}`;
}

// Everything the reader got off the page, laid out per kind. A one-line
// summary was all that showed, so a prescription with six medications and a
// discharge summary with a diagnosis and a follow-up date both rendered as a
// single sentence and nothing else.
const DETAIL_ROWS = {
  discharge_summary: [["Hospital","hospital"],["Consultant","consultant"],
                      ["Admitted","admitted_on"],["Discharged","discharged_on"],
                      ["Diagnosis","diagnosis"],
                      ["Condition at discharge","condition_at_discharge"],
                      ["Follow-up due","follow_up_on"]],
  prescription:      [["Prescribed on","prescribed_on"],["Prescriber","prescriber"]],
  policy:            [["Insurer","insurer"],["Policy number","policy_number"],
                      ["Sum insured","sum_insured_inr"],["Co-pay","copay_percent"],
                      ["Room rent limit","room_rent_percent_per_day"],
                      ["ICU limit","icu_percent_per_day"],["Valid until","valid_until"]],
  blood_report:      [["Collected on","collected_on"]],
};
const MONEY_KEYS = new Set(["sum_insured_inr"]);
const PERCENT_KEYS = new Set(["copay_percent","room_rent_percent_per_day","icu_percent_per_day"]);
// Prose belongs on its own line. A diagnosis right-aligned in bold against a
// label is a sentence pretending to be a figure.
const PROSE_KEYS = new Set(["diagnosis","condition_at_discharge"]);

function detailValue(key, value){
  if(MONEY_KEYS.has(key)) return `INR ${Number(value).toLocaleString("en-IN")}`;
  if(PERCENT_KEYS.has(key)) return `${esc(value)}%`;
  return esc(value);
}

// "1 - 0 - 0 after breakfast 30 days" is a transcription of what the paper
// prints. The three numbers are morning, afternoon and night.
//
// The slots are rendered ONLY when that pattern is actually on the page. Where
// the prescription says "once daily, after breakfast" instead, the words are
// shown as they were written — deciding which slot that meant would be this
// code inventing a dosing time, and a dosing time invented by a renderer is
// exactly the kind of thing nobody double-takes at.
function parseDose(frequency){
  let rest = String(frequency||"").trim();
  if(!rest) return {slots:null, chips:[]};

  let slots = null;
  const pattern = rest.match(/(\d+)\s*[-–—]\s*(\d+)\s*[-–—]\s*(\d+)/);
  if(pattern){
    slots = [pattern[1], pattern[2], pattern[3]];
    rest = rest.replace(pattern[0], " ");
  }

  const chips = [];
  const duration = rest.match(/\b\d+\s*(days?|weeks?|months?)\b/i);
  if(duration){ rest = rest.replace(duration[0], " "); }

  rest.split(/[,;·]/).map(t=>t.trim()).filter(Boolean).forEach(t=>chips.push(t));
  if(duration) chips.push(duration[0].trim());
  return {slots, chips};
}

const SLOT_TITLES = ["morning", "afternoon", "night"];

function medRow(m){
  const {slots, chips} = parseDose(m.frequency);
  // "Tab ASPIRIN" is a form and a name. Splitting them lets the name be read.
  const raw = String(m.name||"").trim();
  const form = raw.match(/^(tab|tablet|cap|capsule|syp|syrup|inj|injection)\b\.?/i);
  const name = form ? raw.slice(form[0].length).trim() : raw;

  const slotHtml = slots ? `<span class="slots">${slots.map((n,i)=>
    `<span class="slot ${Number(n)>0?"on":""}" title="${SLOT_TITLES[i]}">${esc(n)}</span>`
    ).join("")}</span>` : "";

  return `<div class="med">
    <div class="mname">${form?`<span class="form">${esc(form[0].replace(/\.$/,""))}</span>`:""}
      <span>${esc(titleCase(name))}</span></div>
    <div class="dose">${esc(m.dose||"")}</div>
    ${slotHtml||chips.length?`<div class="when">${slotHtml}
      ${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>`:""}
  </div>`;
}

// ASPIRIN shouted at a reader is harder to read than Aspirin, and the paper
// only shouts because prescriptions are printed in caps.
function titleCase(text){
  if(text !== text.toUpperCase()) return text;
  return text.toLowerCase().replace(/\b[a-z]/g, c=>c.toUpperCase());
}

function docDetails(d){
  const det = d.details || {};
  const rows = (DETAIL_ROWS[d.kind]||[])
    .filter(([,key]) => det[key] !== null && det[key] !== undefined && det[key] !== "")
    .map(([label,key]) => PROSE_KEYS.has(key)
      ? `<div class="row stack"><div class="k">${esc(label)}</div>
           <div class="v">${detailValue(key, det[key])}</div></div>`
      : row(label, detailValue(key, det[key])))
    .join("");

  const allergies = (det.allergies||[]).filter(Boolean);
  const allergyBlock = allergies.length ? `<div class="row stack">
      <div class="k">Allergies on this document</div>
      <div class="v"><span class="chip warn">${allergies.map(esc).join('</span> <span class="chip warn">')}</span></div>
    </div>` : "";

  const network = (det.network_hospitals||[]).filter(Boolean);
  const networkBlock = network.length ? `<div class="row stack">
      <div class="k">Network hospitals</div>
      <div class="v">${network.map(h=>`<span class="chip">${esc(h)}</span>`).join(" ")}</div>
    </div>` : "";

  const meds = det.medications || det.discharge_medications || [];
  const heading = det.discharge_medications ? "Discharge medication" : "On this prescription";
  const anySlots = meds.some(m => parseDose(m.frequency).slots);
  const medBlock = meds.length ? `<div class="meds">
      <div class="meds-head"><h3>${heading}</h3>
        <span class="count num">${meds.length} item${meds.length===1?"":"s"}</span></div>
      ${anySlots?`<p class="meds-legend">Doses read as morning · afternoon · night.</p>`:""}
      ${meds.map(medRow).join("")}
    </div>` : "";

  return `${rows}${allergyBlock}${networkBlock}${medBlock}`;
}

// Same shape as the bill photograph: the bucket is private, so the URL is
// fetched through the credentialed API and the tab is opened synchronously on
// the click, before the await, or the browser treats it as a popup.
function openDocPhoto(documentId){
  const tab = window.open("", "_blank");
  api(`/api/parents/${encodeURIComponent(S.parentId)}/documents/${encodeURIComponent(documentId)}/image`,
      {auth:true}).then(r=>{
    if(!tab) return;
    if(r && r.url){ tab.location = r.url; return; }
    tab.document.title = "Photograph unavailable";
    tab.document.body.style.font = "16px system-ui";
    tab.document.body.style.padding = "24px";
    tab.document.body.textContent = (r && (r.detail || r.__error))
      || "That photograph could not be opened.";
  }).catch(()=>{ if(tab) tab.document.body.textContent = "That photograph could not be opened."; });
}

// The photograph sits behind the credential, so a plain href cannot reach it —
// an anchor carries no bearer token and no signed link parameters, and the
// endpoint correctly answered 401 every time. Fetch it the way every other
// credentialed read is fetched, then send the tab to the short-lived signed URL.
//
// The tab is opened synchronously on the click, before the await: a window
// opened from a resolved promise is a popup, and browsers block it.
function openBillPhoto(billId){
  const tab = window.open("", "_blank");
  api(`/api/cases/${encodeURIComponent(S.caseId)}/bills/${encodeURIComponent(billId)}/image`,
      {auth:true}).then(r=>{
    if(!tab) return;
    if(r && r.url){ tab.location = r.url; return; }
    // Say what happened rather than leaving a blank tab, which reads as a
    // browser failure rather than as a boundary or a missing bucket.
    tab.document.title = "Photograph unavailable";
    tab.document.body.style.font = "16px system-ui";
    tab.document.body.style.padding = "24px";
    tab.document.body.textContent = (r && (r.detail || r.__error))
      || "That photograph could not be opened. Sign in on the dashboard and try again.";
  }).catch(()=>{ if(tab) tab.document.body.textContent = "That photograph could not be opened."; });
}

// What was billed, before what an insurer said about it. The photograph is one
// tap away from every figure, because a number you cannot check against the
// paper it came from is worth very little.
function vBills(){
  const b = S.bills;
  if(!b || b.__denied || b.__error) return "";
  const bills = b.bills || [], est = b.estimate || {};
  if(!bills.length) return "";

  const inr = n => `INR ${Number(n||0).toLocaleString("en-IN")}`;
  const billed = est.total_billed_inr || 0;
  const pay = est.estimated_you_pay_inr || 0;
  const cov = est.estimated_covered_inr || 0;
  const pct = t => billed ? Math.max(t > 0 ? 1.5 : 0, (t / billed) * 100) : 0;

  const costly = (est.lines||[]).filter(l => l.estimated_you_pay_inr > 0);
  const free   = (est.lines||[]).filter(l => !(l.estimated_you_pay_inr > 0));
  const freeTotal = free.reduce((s,l)=>s+(l.claimed_inr||0),0);

  // A reason people can take in without reading: what kind of rule bit, first,
  // then the arithmetic for anyone who wants to check it.
  const reason = l => {
    const r = String(l.rule||"");
    if(/exclud/i.test(r)) return `<span class="tag excl">Not covered</span>${esc(r)}`;
    if(/sub-limit/i.test(r)) return `<span class="tag limit">Sub-limit</span>${esc(r)}`;
    if(/no policy/i.test(r)) return `<span class="tag excl">No policy on file</span>${esc(r)}`;
    return esc(r);
  };

  return `
  <div class="card edge-red">
    <div class="headline">
      <div class="lbl">Estimated to pay</div>
      <div class="amt">${inr(pay)}</div>
      <div class="of">of ${inr(billed)} billed across ${est.bills_counted||bills.length} bill(s)</div>
    </div>
    <div class="split">
      <i class="cov" style="width:${pct(cov)}%"></i><i class="pay" style="width:${pct(pay)}%"></i>
    </div>
    <div class="legend">
      <span><span class="key" style="background:var(--teal)"></span>Estimated covered <b>${inr(cov)}</b></span>
      <span><span class="key" style="background:var(--red)"></span>Estimated to pay <b>${inr(pay)}</b></span>
    </div>
    <div class="pills" style="margin-top:12px">
      <span class="pill p-amber">ESTIMATE, NOT THE INSURER'S DECISION</span>
      ${est.needs_review?`<span class="pill p-red">A LINE NEEDS CHECKING</span>`:""}
      ${est.may_understate?`<span class="pill p-red">LIKELY TO BE MORE THAN THIS</span>`:""}
    </div>
    ${est.may_understate?`<div class="strip note" style="margin-top:12px">
      ${esc(est.may_understate_note)}</div>`:""}
  </div>

  ${costly.length?`<div class="card">
    <h2>What you are estimated to pay for</h2>
    ${costly.map(l=>`
      <div class="bline">
        <div class="top">
          <div class="name">${esc(l.label)}</div>
          <div class="pay">${inr(l.estimated_you_pay_inr)}</div>
        </div>
        ${l.vendor?`<div class="src">${esc(l.vendor)}</div>`:""}
        <div class="bar">
          <i class="cov" style="width:${l.claimed_inr?(l.estimated_covered_inr/l.claimed_inr)*100:0}%;background:var(--teal)"></i>
          <i class="pay" style="width:${l.claimed_inr?(l.estimated_you_pay_inr/l.claimed_inr)*100:0}%;background:var(--red)"></i>
        </div>
        <div class="why">${reason(l)}</div>
        <div class="why" style="margin-top:3px;color:var(--ink-mute)">
          billed ${inr(l.claimed_inr)} · covered ${inr(l.estimated_covered_inr)}</div>
      </div>`).join("")}
  </div>`:""}

  ${free.length?`<div class="card">
    <details class="covered">
      <summary><span>${free.length} line(s) estimated fully covered</span>
        <b>${inr(freeTotal)}</b></summary>
      ${free.map(l=>`<div class="covrow">
        <span>${esc(l.label)}${l.vendor?` <span style="color:var(--ink-mute)">· ${esc(l.vendor)}</span>`:""}</span>
        <b>${inr(l.claimed_inr)}</b></div>`).join("")}
    </details>
  </div>`:""}

  <div class="card">
    <h2 class="mini">The bills these came from</h2>
    ${bills.map(bill=>`
      <div class="row stack">
        <div class="k">${[esc(bill.vendor||"bill"), bill.bill_date?esc(bill.bill_date):null,
            `${bill.line_items.length} line items`].filter(Boolean).join(" · ")}</div>
        <div class="v">
          <a href="#" onclick="openBillPhoto('${esc(bill.bill_id)}');return false">open the photograph</a>
          ${bill.needs_review?`<span class="why2" style="color:var(--red-ink)">${esc(bill.review_reason||"")}</span>`:""}
        </div>
      </div>`).join("")}
    <div class="row"><div class="k">Actually settled</div>
      <div class="v">${est.settled_inr===null||est.settled_inr===undefined
        ? unknown("no adjudication yet. Nobody has decided anything, which is not the same as nothing being owed")
        : inr(est.settled_inr)}</div></div>
    <p class="mute" style="margin-top:12px">${esc(est.disclaimer||"")}</p>
    <p class="mute" style="margin-top:6px">${esc(est.basis||"")}</p>
  </div>`;
}

// ---- interim bill payment ------------------------------------------------
//
// This view renders what the enforcer decided. It computes no cap, makes no
// pay/refuse decision, and never sees a payment address: the API returns a
// label and a hash reference, so the raw destination cannot reach the DOM even
// by accident. Every figure below is a field the backend already summed.

function vPayments(){
  const p = S.pay;
  if(!p || p.__denied || p.__error) return "";
  const m = p.mandate;
  const open = (p.escalations || []).filter(e => e.open);
  const done = (p.escalations || []).filter(e => !e.open);

  return `<div class="sec">Interim bills</div>
  ${S.payNote?`<div class="strip ${S.payNoteOk?"note":""}"
     style="${S.payNoteOk?"background:var(--teal-bg);color:var(--teal-ink)"
                        :"background:var(--red-bg);color:var(--red-ink)"}">
     ${esc(S.payNote)}</div>`:""}
  ${S.signInFor?signInPanel(S.signInFor):""}
  <div class="strip note">${esc(p.note || "")} Autonomy is bounded: the agent pays only
    inside the limits you set, and anything else comes to you.</div>
  ${open.map(refusalCard).join("")}
  ${vUnconsidered()}
  ${vMandate(m, p)}
  ${vMoney(p)}
  ${(p.payments || []).map(paymentCard).join("")}
  ${done.length?`<details class="covered"><summary>${done.length} earlier
      refusal${done.length===1?"":"s"}, since dealt with</summary>
      ${done.map(e => `<div class="row stack"><div class="k">${esc(e.bill_id)}</div>
        <div class="v">${esc(e.reason||"")}</div></div>`).join("")}</details>`:""}`;
}

// The lead. A bill the agent would not pay, why not, and the one action that
// resolves it — all in the same place, because a family reading this on a phone
// at 3am should not have to go looking for the button.
function refusalCard(e){
  const named = String(e.failing_check || "a check").replace(/_/g, " ");
  return `<div class="refusal">
    <span class="named">not paid: ${esc(named)}</span>
    <div class="head">
      <div><strong>Bill ${esc(e.bill_id)}</strong> needs you</div>
      <div class="amt">${inr(e.amount_inr)}</div>
    </div>
    <p class="why">${esc(e.reason || "")}</p>
    <p class="mute" style="margin-top:8px">Nothing has moved. The agent checked this
      against the limits you set and stopped rather than guessing.</p>
    <div class="btns">
      <button class="btn" onclick="approvePayment('${esc(e.bill_id)}',${Number(e.amount_inr)||0})"
        ${S.payBusy===e.bill_id?"disabled":""}>
        ${S.payBusy===e.bill_id?"Approving…":`Approve ${inr(e.amount_inr)}`}</button>
    </div>
  </div>`;
}

function vMandate(m, p){
  if(!m) return `<div class="card edge-amber">
    <h2 class="mini">No payment mandate</h2>
    <p>Every interim bill needs your approval. Nothing is paid automatically,
      and nothing can be: there is no authorised destination on this case.</p>
    ${S.token?`<div class="btns"><button class="btn" onclick="showMandateForm()">
      Set up automatic payment</button></div>`:`<p class="mute" style="margin-top:10px">
      Granting one needs a signed-in family session.</p>`}
    ${S.mandateForm?mandateForm():""}
  </div>`;

  return `<div class="card edge-teal">
    <h2 class="mini">Automatic payment is on</h2>
    ${row("Pays only", esc(m.payee_label))}
    ${row("Account reference", `<span class="num" style="font-size:13px">${esc(m.payee_ref)}</span>`)}
    ${row("Per bill, at most", `<span class="num">${inr(m.per_bill_cap_inr)}</span>`)}
    ${row("In total, at most", `<span class="num">${inr(m.total_cap_inr)}</span>`)}
    ${row("Still authorised", `<span class="num">${inr(m.remaining_inr)}</span>`)}
    ${row("Until", esc(new Date(m.window_closes_at).toLocaleString()))}
    <p class="mute" style="margin-top:10px">The destination is fixed. A bill can ask for
      an amount; it can never change where money goes. To pay somewhere else you would
      stop this and set it up again.</p>
    ${S.token?`<div class="btns"><button class="btn ghost" onclick="revokeMandate()">
      Stop automatic payment</button></div>`:""}
  </div>`;
}

function vMoney(p){
  return `<div class="split2" style="margin-bottom:12px">
    <div class="moneybox"><div class="k">Settled</div>
      <div class="v">${inr(p.paid_inr)}</div>
      <p class="mute" style="margin-top:4px">confirmed by the rail</p></div>
    <div class="moneybox"><div class="k">Initiated, not confirmed</div>
      <div class="v">${inr(p.initiated_unconfirmed_inr)}</div>
      <p class="mute" style="margin-top:4px">sent, and not yet acknowledged. Not counted as paid</p></div>
  </div>`;
}

// A bill that is payable and has never been put to the enforcer — the
// mandate-granted-after-the-bill case. Asking is a trigger, not an override:
// the amount comes from the stored bill and the destination from the mandate.
function vUnconsidered(){
  const p = S.pay, b = S.bills;
  if(!p || !b || !b.bills || !S.token) return "";
  // Only a refusal that still stands counts as decided. One superseded by a
  // mandate being granted since is filed, not settled, so its bill comes back
  // here and asks to be checked rather than sitting under a closed refusal
  // with no way to act on it.
  const decided = new Set([
    ...(p.payments || []).map(x => x.bill_id),
    ...(p.escalations || []).filter(x => x.open || !x.superseded_by_mandate)
       .map(x => x.bill_id),
  ]);
  const waiting = b.bills.filter(x => (x.balance_due_inr || 0) > 0
                                      && !decided.has(x.bill_id));
  if(!waiting.length) return "";

  return waiting.map(x => `<div class="card">
    <h2 class="mini">Bill ${esc(x.bill_id)} has ${inr(x.balance_due_inr)} outstanding</h2>
    <p class="mute">It has not been put to the payment checks yet.</p>
    <div class="btns"><button class="btn ghost"
      onclick="considerBill('${esc(x.bill_id)}')">Check it against my limits</button></div>
  </div>`).join("");
}

async function considerBill(billId){
  await fetch(`${API}/api/cases/${encodeURIComponent(S.caseId)}/bills/${encodeURIComponent(billId)}/consider`,
    {method:"POST", headers:{Authorization:`Bearer ${S.token}`}});
  await load();
}

function paymentCard(x){
  // "paid" is reserved for money the rail has confirmed. Until then it was
  // SENT, which is a different fact — the card used to say "paid automatically"
  // and "not counted as paid" in the same breath.
  const how = x.autonomous ? "automatically" : "after you approved it";
  const state = x.confirmed ? `paid ${how}` : `sent ${how}`;
  // The rail, not a blanket "(simulated)". A test-mode Razorpay capture and a
  // simulated payout are both short of real money, but they are short of it in
  // different ways, and the card claimed the same thing about each.
  const detail = x.confirmed
    ? `Settled with ${esc(x.payee_label)}. ${esc(x.settlement_note || "")}`
    : `Sent to ${esc(x.payee_label)}. Not confirmed yet, so it is not counted as paid.`;

  return `<div class="cleared">
    <div class="head" style="display:flex;justify-content:space-between;gap:12px">
      <div><strong>Bill ${esc(x.bill_id)}</strong> · ${state}</div>
      <div class="num" style="font-weight:800">${inr(x.amount_inr)}</div>
    </div>
    <p class="mute" style="margin-top:4px">${detail}</p>
    ${!x.confirmed && x.checkout_url?`<button class="paper"
      onclick="window.open('${esc(x.checkout_url)}','_blank')">
      <span aria-hidden="true">\u25B8</span> Open the payment page</button>`:""}
    ${!x.confirmed?(S.upi&&S.upi.payment_id===x.payment_id
      ? upiPanel(S.upi)
      : `<button class="paper" onclick="showUpi('${esc(x.payment_id)}')">
          <span aria-hidden="true">\u25A6</span> Pay by UPI</button>`):""}
    ${(x.guards_passed||[]).length?`<div class="guards">${
      x.guards_passed.map(g=>`<span class="guard">${esc(String(g).replace(/_/g," "))}</span>`).join("")
    }</div>`:""}
  </div>`;
}

// UPI is how an Indian family actually settles a hospital bill: scan, confirm
// in whichever app they use, done. No provider onboarding, nothing for the
// hospital to integrate, and it works on the phone already in their hand.
//
// Fetched on demand rather than shipped with the payment list. Every other
// response carries a reference to the destination instead of the destination,
// so this is the one place an address arrives, and asking for it is a
// deliberate act rather than a side effect of opening the tab.
function upiPanel(u){
  return `<div class="card" style="margin-top:10px;text-align:center">
    <h2 class="mini">Pay ${inr(u.amount_inr)} to ${esc(u.payee_label)}</h2>
    <div style="max-width:210px;margin:10px auto;line-height:0">${u.qr_svg||""}</div>
    <p class="mute">Scan with any UPI app, or use the ID below.</p>
    <p class="num" style="font-weight:700;word-break:break-all">${esc(u.payee_vpa||"")}</p>
    <div class="btns" style="justify-content:center">
      <a class="btn" href="${esc(u.upi_intent||"")}">Open a UPI app</a>
      <button class="btn ghost" onclick="hideUpi()">Close</button>
    </div>
    <p class="mute" style="margin-top:8px">This is the destination on your
      mandate. A bill cannot change it.</p>
  </div>`;
}

async function showUpi(paymentId){
  if(!S.token){
    askSignIn("Seeing where a payment goes needs a signed-in family session.");
    return;
  }
  const r = await fetch(`${API}/api/cases/${encodeURIComponent(S.caseId)}`
    + `/payments/${encodeURIComponent(paymentId)}/upi`,
    {headers:{Authorization:`Bearer ${S.token}`}});
  if(!r.ok){ S.payNote = `Could not load the UPI details (HTTP ${r.status}).`;
             S.payNoteOk = false; render(); return; }
  S.upi = await r.json();
  render();
}

function hideUpi(){ S.upi = null; render(); }

function mandateForm(){
  return `<div class="card" style="margin-top:12px">
    <h2 class="mini">Authorise automatic payment</h2>
    <p class="mute">Read the hospital's UPI address off their billing desk and type it

function showMandateForm(){ S.mandateForm = true; S.mandateError = null; render(); }

// Signing in has to happen WHERE the person is. Sending them to another tab to
// do it — which is what approving used to do — loses the thing they were in the
// middle of and looks like the button did nothing.
//
// It also has to offer the same choice the gate offers. "Sign in to share" ran
// signIn() directly, which silently used the demo credential even on a
// deployment with Google configured.
function signInPanel(reason){
  return `<div class="card edge-teal" style="margin-top:12px">
    <h2 class="mini">Sign in to continue</h2>
    <p>${esc(reason)}</p>
    <p class="mute" style="margin-top:6px">The link that opened this page can read
      the record. Authorising money or sharing with a clinician needs a session.</p>
    <div class="btns" style="align-items:center">
      <div id="gbtn"></div>
      <button class="btn ghost" onclick="signIn()">Use the demo credential</button>
    </div>
  </div>`;
}

function askSignIn(reason){ S.signInFor = reason; render(); }

async function confirmMandate(){
  const vpa = document.getElementById("mvpa")?.value?.trim() || "";
  const label = document.getElementById("mlabel")?.value?.trim() || "";
  // Shown back before anything is granted, because this is the one value in
  // the system that decides where money goes.
  if(!confirm(`Authorise automatic payment to:\n\n${label || "(no name)"}\n${vpa}\n\n`
      + `This becomes the only destination on this case. It cannot be changed by a bill.`)) return;

  const body = {
    payee_vpa: vpa, payee_label: label,
    per_bill_cap_inr: Number(document.getElementById("mper")?.value || 0),
    total_cap_inr: Number(document.getElementById("mtot")?.value || 0),
    hours: Number(document.getElementById("mhrs")?.value || 0),
    granted_by: S.who?.name || "family",
  };
  const r = await fetch(`${API}/api/cases/${encodeURIComponent(S.caseId)}/payment-mandate`,
    {method:"POST", headers:{Authorization:`Bearer ${S.token}`,
     "content-type":"application/json"}, body: JSON.stringify(body)});
  const out = await r.json();
  if(!r.ok){ S.mandateError = out.detail || `HTTP ${r.status}`; render(); return; }
  S.mandateForm = false; S.mandateError = null;
  await load();
}

async function revokeMandate(){
  if(!confirm("Stop automatic payment? Every further bill will need your approval.")) return;
  await fetch(`${API}/api/cases/${encodeURIComponent(S.caseId)}/payment-mandate`,
    {method:"DELETE", headers:{Authorization:`Bearer ${S.token}`}});
  await load();
}

async function approvePayment(billId, amount){
  if(!S.token){
    askSignIn(`Approving ${inr(amount)} for bill ${billId} needs a signed-in family session.`);
    return;
  }
  if(!confirm(`Approve ${inr(amount)} for bill ${billId}?`)) return;
  S.payBusy = billId; render();
  try{
    const r = await fetch(`${API}/api/cases/${encodeURIComponent(S.caseId)}/payments/approve`,
      {method:"POST", headers:{Authorization:`Bearer ${S.token}`,
       "content-type":"application/json"},
       body: JSON.stringify({bill_id: billId, amount_inr: amount,
                             approved_by: S.who?.name || "family"})});
    const out = await r.json();
    // Say what happened. The refusal card disappears on reload, and a card
    // vanishing with nothing in its place reads as a failure.
    S.payNote = r.ok
      ? `Approved. ${inr(out.amount_inr ?? amount)} initiated to ${out.payee_label || "the hospital"}. Not settled yet.`
      : `Not approved: ${out.detail || `HTTP ${r.status}`}`;
    S.payNoteOk = r.ok;
  } catch(e){ S.payNote = `Not approved: ${String(e)}`; S.payNoteOk = false;
  } finally { S.payBusy = null; }
  await load();
}

// ---- who is signed in, and what that actually permits --------------------
//
// The header said "signed in" and nothing else, which answers the smaller
// half of the question. Signing in says who you are; it does not say whose
// record you may open, and in this system those are deliberately different
// facts. The menu shows both, plus the consents this contact actually gave,
// because a per-purpose consent nobody can look at is a checkbox.

function initials(name){
  const parts = String(name||"").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length-1][0] : "")).toUpperCase();
}

// The contact this session corresponds to, if the record is open and one of
// its contacts carries the signed-in address. Read from what the server
// already returned rather than asked for separately.
function signedInContact(){
  const email = (S.who?.email || "").trim().toLowerCase();
  if(!email) return null;
  return (S.record?.profile?.family_contacts || [])
    .find(c => (c.email || "").trim().toLowerCase() === email) || null;
}

      <button class="act" onclick="S.view='audit';closeAccount();render()">

// Sign in with Google.
//
// The browser receives an ID TOKEN and sends it as the bearer. It is not
// inspected here and it could not be trusted if it were: the server verifies
// it against Google's published keys with our client id pinned as the
// audience, and then separately checks that the account is a family contact on
// this parent. A signature this page checked itself would prove nothing.
let GOOGLE_DRAWING = false;
async function signInWithGoogle(){
  if(GOOGLE_DRAWING) return;
  GOOGLE_DRAWING = true;
  try { await drawGoogleButton(); } finally { GOOGLE_DRAWING = false; }
}

async function drawGoogleButton(){
  const cfg = S.authConfig || (S.authConfig = await api("/api/auth-config"));
  const clientId = cfg?.google_client_id;
  if(!clientId){
    const slot = document.getElementById("gbtn");
    if(slot) slot.innerHTML =
      `<p class="mute">Google sign-in is not configured on this deployment.</p>`;
    return;
  }
  try{
    await loadGoogleScript();
    google.accounts.id.initialize({
      client_id: clientId,
      callback: async (response) => {
        S.token = response.credential;
        S.authError = null; S.signInFor = null;
        S.who = await api("/api/whoami", {auth:true});
        await load();
      },
    });

    // A RENDERED button, not one-tap. `prompt()` is suppressed by the browser
    // for reasons that have nothing to do with this app — an exponential
    // cooldown after a couple of dismissals, third-party cookies switched off —
    // and a sign-in button that silently does nothing is indistinguishable
    // from a broken one. The rendered button always opens the popup.
    const slot = document.getElementById("gbtn");
    if(slot){
      slot.innerHTML = "";
      google.accounts.id.renderButton(slot, {
        theme: "outline", size: "large", text: "signin_with",
        shape: "rectangular", width: 260,
      });
    }
  }catch(e){
    const slot = document.getElementById("gbtn");
    if(slot) slot.innerHTML =
      `<p class="mute">Google sign-in could not start: ${esc(String(e))}</p>`;
  }
}

function loadGoogleScript(){
  if(window.google?.accounts?.id) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const tag = document.createElement("script");
    tag.src = "https://accounts.google.com/gsi/client";
    tag.async = true;
    tag.onload = resolve;
    tag.onerror = () => reject(new Error("the Google script did not load"));
    document.head.appendChild(tag);
  });
}

function signOut(){
  S.token = null; S.who = null; S.record = null; S.authError = null;
  try{ google?.accounts?.id?.disableAutoSelect(); }catch{ /* not loaded */ }
  load();
}

// A family member arrives from a WhatsApp alert, on a phone, at 2am. The link
// names the case; landing them on an empty page and asking them to paste an id
// would be the product failing at the only moment it matters.
// A real map of the routing decision. Deliberately NOT a live position: no
// location is ever collected from the parent, and drawing a moving dot would
// invent tracking this system does not do and says it does not do.
let MAP_LOADED = false;

async function drawMap(){
  const el = document.getElementById("map");
  if(!el || !S.trail) return;
  const t = last("triage.decision");
  if(!t) return;

  const cfg = await api("/api/map-config");
  if(!cfg?.maps_api_key){
    el.innerHTML = `<p class="mute" style="padding:16px">${unknown("no maps key is configured")}</p>`;
    return;
  }

  if(!MAP_LOADED){
    await new Promise((ok, fail) => {
      const sc = document.createElement("script");
      sc.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(cfg.maps_api_key)}`;
      sc.onload = ok; sc.onerror = fail;
      document.head.appendChild(sc);
    }).catch(()=>{});
    MAP_LOADED = !!(window.google && window.google.maps);
  }
  if(!window.google || !window.google.maps){
    el.innerHTML = `<p class="mute" style="padding:16px">${unknown("the map could not be loaded")}</p>`;
    return;
  }

  const ranked = t.payload.ranked || [];
  const chosen = t.payload.recommended_hospital_id;
  const home = t.payload.report || {};
  const map = new google.maps.Map(el, {
    center: {lat: home.lat ?? ranked[0]?.lat ?? 8.7642, lng: home.lon ?? 78.14},
    zoom: 12, mapTypeControl:false, streetViewControl:false, fullscreenControl:false,
  });
  const bounds = new google.maps.LatLngBounds();

  if(home.lat && home.lon){
    const at = {lat: home.lat, lng: home.lon};
    new google.maps.Marker({map, position: at, title: "Where she was when she messaged",
      label: {text:"H", color:"#fff"},
      icon:{path:google.maps.SymbolPath.CIRCLE, scale:12, fillColor:"#1f6f5c",
            fillOpacity:1, strokeColor:"#fff", strokeWeight:2}});
    bounds.extend(at);
  }

  (S.hospitals || []).forEach(h => {
    const scored = ranked.find(r => r.hospital_id === h.hospital_id);
    const isChosen = h.hospital_id === chosen;
    const at = {lat: h.lat, lng: h.lon};
    new google.maps.Marker({map, position: at, title: h.name,
      icon:{path:google.maps.SymbolPath.CIRCLE, scale: isChosen ? 11 : 7,
            fillColor: isChosen ? "#b3261e" : "#94a3b8", fillOpacity:1,
            strokeColor:"#fff", strokeWeight:2}});
    const info = new google.maps.InfoWindow({content:
      `<div style="font:13px system-ui"><b>${esc(h.name)}</b><br>` +
      (scored ? `${scored.distance_km?.toFixed(1)} km · ` +
                `${scored.network_match ? "in network" : "not in network"}` : "") +
      (isChosen ? "<br><b>chosen</b>" : "") + "</div>"});
    info.open(map, new google.maps.Marker({map, position: at, visible:false}));
    bounds.extend(at);
  });

  if(!bounds.isEmpty()) map.fitBounds(bounds, 60);
}

function caseFromLink(){
  try { return new URLSearchParams(location.search).get("case"); }
  catch { return null; }
}

function tokenFromLink(){
  try { return new URLSearchParams(location.search).get("t"); }
  catch { return null; }
}

async function load(){
  if(!S.hospitals) S.hospitals = (await api("/api/hospitals"))?.hospitals || [];
  // Whichever credential is held, the header should say who it belongs to.
  // /api/whoami never 401s, so this is safe to ask on every load.
  if(S.token && !S.who) S.who = await api("/api/whoami", {auth:true});
  if(S.caseId){
    S.trail=await api(`/api/cases/${S.caseId}/trail`,{auth:true});
    S.brief=await api(`/api/cases/${S.caseId}/brief`,{auth:true});
    S.verify=await api(`/api/cases/${S.caseId}/verify`);
    S.bills=await api(`/api/cases/${S.caseId}/bills`,{auth:true});
    S.pay=await api(`/api/cases/${S.caseId}/payments`,{auth:true});
    S.dx=await api(`/api/cases/${S.caseId}/diagnostics`,{auth:true});
    S.appointments=await api(`/api/cases/${S.caseId}/appointments`,{auth:true});
    if(!S.parentId && S.brief?.brief) S.parentId=S.brief.brief.parent_id;
  }
  if(S.parentId && (S.token || S.linkToken)){
    S.record=await api(`/api/parents/${S.parentId}`,{auth:true});
    S.wellbeing=await api(`/api/parents/${S.parentId}/wellbeing`,{auth:true});
    S.careCircle=await api(`/api/parents/${S.parentId}/care-circle`,{auth:true});
    S.recovery=await api(`/api/parents/${S.parentId}/recovery`,{auth:true});
  }
  S.booted = true;
  render();
}
function render(){
  const v={now:vNow,brief:vBrief,routing:vRouting,record:vRecord,claim:vClaim,audit:vAudit};
  document.getElementById("app").innerHTML=v[S.view]();
  const whoLabel = S.who?.signed_in ? ` · ${S.who.name}`
    : S.token ? " · signed in"
    : S.linkToken ? " · opened from a link"
    : " · not signed in";
  document.getElementById("sub").textContent=(S.caseId||"no case open")+whoLabel;
  renderAccount();
  const b=S.brief?.brief;
  document.getElementById("stamp").textContent = b?.as_of
    ? "as of "+new Date(b.as_of).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})
    : "snapshot";
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.v===S.view));
  window.scrollTo(0,0);
  if(S.view === "routing") drawMap();
  // The gate is re-rendered on every state change, which destroys the node the
  // Google button was drawn into. Redraw it whenever the slot is back.
  if(document.getElementById("gbtn")) signInWithGoogle();
}
document.querySelectorAll("nav button").forEach(b=>
  b.addEventListener("click",()=>{S.view=b.dataset.v; SYNTH_SHOWN=false; render();}));

// Open the case the link names, and show it in the box so it is obvious which
// episode is on screen rather than appearing by magic.
(function openLinkedCase(){
  const linked = caseFromLink();
  if(!linked) return;
  S.caseId = linked;
  S.linkToken = tokenFromLink();
  // A message about a bill should open on the bill, not on the front page.
  try {
    const wanted = new URLSearchParams(location.search).get("view");
    if(wanted && document.querySelector(`nav button[data-v="${wanted}"]`)) S.view = wanted;
  } catch { /* no view param, stay on the default */ }
  const box = document.getElementById("cid");
  if(box) box.value = linked;
  load();
})();

render();
</script>
